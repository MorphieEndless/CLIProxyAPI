name: Build CPA Linux (Morphie Patch)

on:
  workflow_dispatch:
  push:
    branches:
      - "patch/**"

permissions:
  contents: write

concurrency:
  group: build-morphie-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and persist gemini_vertex_executor.go patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-vertex-sig-patch.py
          if ! git diff --quiet internal/runtime/executor/gemini_vertex_executor.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/runtime/executor/gemini_vertex_executor.go
            git commit -m "fix(vertex): wire Vertex thoughtSignature sanitizer and provenance [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Refresh models catalog
        shell: bash
        run: bash .github/scripts/refresh-model-catalogs.sh || echo "::warning::Model catalog refresh skipped"
      - name: Run signature and Vertex executor tests
        shell: bash
        run: |
          set -euo pipefail
          go vet ./internal/signature/... ./internal/runtime/executor/...
          go test -v ./internal/signature/...
          go test -v ./internal/runtime/executor -run 'Test.*Vertex.*|TestGeminiExecutorReplacesVertexBareTinkSignature|TestAntigravityExecutorReplacesVertexBareTinkSignature|TestAntigravityReasoningReplay.*'
      - name: Build Linux amd64 glibc binary (plugin-enabled)
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="8.0.79-morphie.1"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist/archive

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e GO_VERSION="${GO_VERSION}" \
            -e RELEASE_VERSION="${RELEASE_VERSION}" \
            -e COMMIT="${COMMIT}" \
            -e BUILD_DATE="${BUILD_DATE}" \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -euo pipefail -c '
              go_archive="go${GO_VERSION}.linux-amd64.tar.gz"
              curl -fsSL "https://go.dev/dl/${go_archive}" -o "/tmp/${go_archive}"
              rm -rf /usr/local/go
              tar -C /usr/local -xzf "/tmp/${go_archive}"
              export PATH="/usr/local/go/bin:${PATH}"

              CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildvcs=false \
                -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
                -o dist/archive/cli-proxy-api ./cmd/server/

              glibc_versions="$(readelf --version-info dist/archive/cli-proxy-api | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -n "${glibc_versions}" ]]; then
                printf "GLIBC versions:\n%s\n" "${glibc_versions}"
                max_glibc="$(printf "%s\n" "${glibc_versions}" | sort -V | tail -n 1)"
                if [[ "$(printf "2.17\n%s\n" "${max_glibc}" | sort -V | tail -n 1)" != "2.17" ]]; then
                  printf "linux amd64 binary requires GLIBC_%s, expected GLIBC_2.17 or older\n" "${max_glibc}" >&2
                  exit 1
                fi
              fi
            '

          cp LICENSE README.md README_CN.md config.example.yaml dist/archive/
          tar -C dist/archive -czf dist/CLIProxyAPI_morphie_linux_amd64.tar.gz cli-proxy-api LICENSE README.md README_CN.md config.example.yaml
          sha256sum dist/archive/cli-proxy-api dist/CLIProxyAPI_morphie_linux_amd64.tar.gz | tee dist/checksums.txt
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-proxy-api-linux-amd64
          path: |
            dist/CLIProxyAPI_morphie_linux_amd64.tar.gz
            dist/checksums.txt
      - name: Publish rolling release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: morphie-latest
          name: Morphie Patched CLIProxyAPI (Vertex ThoughtSignature Fix)
          body: |
            Patched build of `CLIProxyAPI` (`patch/vertex-thought-signature`) with B1 Vertex `thoughtSignature` key-domain sanitization + Vertex outbound signature provenance tracking.
          files: |
            dist/CLIProxyAPI_morphie_linux_amd64.tar.gz
            dist/checksums.txt
          prerelease: true
          make_latest: false
